<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home work 66</title>
</head>
<body>
    <div id="container"></div>
<script>
    const container = document.getElementById('container');
    for (let i = 1; i < 6; i++) {
        const e = document.createElement('div');
        e.classList.add('element');
        e.textContent = `Element ${i}`;
        container.appendChild(e);

    }
</script>
</body>
</html>
